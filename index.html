<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>创业板指 ÷ 中证红利｜十年日线</title><script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1120;color:#e9effa;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1200px;margin:auto;padding:20px}h1{font-size:23px;margin:0 0 7px}.sub,.hint,.foot{color:#91a0ba}.sub{line-height:1.7}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.card,.panel{background:#151f33;border:1px solid #293956;border-radius:12px;padding:14px}.v{font-size:23px;font-weight:bold;margin:8px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button{background:#1a2942;border:1px solid #344764;color:#d0dced;border-radius:8px;padding:8px 12px}button.active{background:#174768}#chart{height:500px}.ok{color:#81d9ad}.err{color:#ff9b9b}.foot{font-size:12px;line-height:1.8;margin-top:14px}@media(max-width:650px){.wrap{padding:12px}.cards{grid-template-columns:repeat(2,1fr)}#chart{height:420px}}
</style></head><body><main class="wrap"><h1>创业板指 ÷ 中证红利</h1><div class="sub">十年日线相对强弱：比值上行代表创业板相对占优，下行代表中证红利相对占优。</div>
<section class="cards"><div class="card">最新比值<div class="v" id="ratio">加载中</div><div class="hint" id="date">等待行情</div></div><div class="card">创业板指 399006<div class="v" id="growth">--</div><div class="hint">当日收盘点位</div></div><div class="card">中证红利 000922<div class="v" id="dividend">--</div><div class="hint">当日收盘点位</div></div><div class="card">历史百分位<div class="v" id="pct">--</div><div class="hint" id="count">按共同交易日计算</div></div></section>
<section class="panel"><div class="toolbar" id="ranges"><button data-r="1">近1年</button><button data-r="3">近3年</button><button data-r="5">近5年</button><button data-r="10" class="active">近10年</button><button data-r="all">全部</button><button id="ma" class="active">均线：开</button><button id="csv">导出CSV</button><button id="refresh">刷新数据</button></div><div id="chart"></div><div id="status">正在加载历史日线……</div></section>
<div class="foot">数据口径：创业板指（399006）÷ 中证红利（000922），按共同交易日对齐，以每日收盘点位计算，不使用周线或插值。数据源：东方财富公开历史行情接口。页面打开时联网抓取；接口限流、跨域策略或网络环境可能影响加载。历史百分位仅为样本内经验分位，不代表估值或未来收益概率，不构成投资建议。</div></main>
<script>
const API='https://push2his.eastmoney.com/api/qt/stock/kline/get',TOKEN='7eea3edcaed734bea9cbfc24409ed989';const chart=echarts.init(document.getElementById('chart'));let data=[],period='10',showMA=true;
async function fetchDaily(secid){const url=API+'?secid='+secid+'&fields1=f1%2Cf2%2Cf3%2Cf4%2Cf5%2Cf6&fields2=f51%2Cf52%2Cf53%2Cf54%2Cf55%2Cf56%2Cf57%2Cf58%2Cf59%2Cf60%2Cf61&klt=101&fqt=0&beg=20161031&end=20500101&lmt=10000&ut='+TOKEN+'&_='+Date.now();const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const json=await res.json();if(!json?.data?.klines)throw Error('指数 '+secid+' 未返回数据');return json.data.klines.map(s=>{const a=s.split(',');return {date:a[0],close:+a[2]}}).filter(x=>x.date&&x.close>0&&Number.isFinite(x.close))}
function ma(n){return data.map((x,i)=>i<n-1?null:+(data.slice(i-n+1,i+1).reduce((s,r)=>s+r.ratio,0)/n).toFixed(6))}
function draw(){let start=0;if(period!=='all'){const d=new Date(data[data.length-1].date+'T12:00:00');d.setFullYear(d.getFullYear()-Number(period));const s=d.toISOString().slice(0,10);start=Math.max(0,data.findIndex(x=>x.date>=s))}const p=data.slice(start),series=[{name:'日线比值',type:'line',data:p.map(x=>x.ratio),symbol:'none',lineStyle:{width:1.8,color:'#48c8e8'},areaStyle:{color:'rgba(72,200,232,.07)'}}];if(showMA)[['20日均线',20,'#f5ad55'],['60日均线',60,'#b58cff'],['250日均线',250,'#78d6a3']].forEach(([name,n,color])=>series.push({name,type:'line',data:ma(n).slice(start),symbol:'none',lineStyle:{width:1.2,color}}));chart.setOption({animation:false,tooltip:{trigger:'axis',valueFormatter:v=>v==null?'--':(+v).toFixed(5)},grid:{left:58,right:20,top:20,bottom:65},xAxis:{type:'category',data:p.map(x=>x.date),axisLabel:{color:'#91a0ba',hideOverlap:true}},yAxis:{type:'value',scale:true,axisLabel:{color:'#91a0ba',formatter:v=>v.toFixed(3)},splitLine:{lineStyle:{color:'#293956',type:'dashed'}}},dataZoom:[{type:'inside'},{type:'slider',height:16,bottom:12}],series},true)}
async function load(){const st=document.getElementById('status');st.className='';st.textContent='正在读取两个指数的每日收盘数据……';try{const [g,d]=await Promise.all([fetchDaily('0.399006'),fetchDaily('1.000922')]);const dm=new Map(d.map(x=>[x.date,x.close]));data=g.filter(x=>dm.has(x.date)).map(x=>({date:x.date,growth:x.close,dividend:dm.get(x.date),ratio:x.close/dm.get(x.date)})).sort((a,b)=>a.date.localeCompare(b.date));if(data.length<500)throw Error('共同交易日数量异常：'+data.length);const last=data[data.length-1];document.getElementById('ratio').textContent=last.ratio.toFixed(5);document.getElementById('date').textContent='最新共同交易日：'+last.date;document.getElementById('growth').textContent=last.growth.toFixed(2);document.getElementById('dividend').textContent=last.dividend.toFixed(2);document.getElementById('pct').textContent=(100*data.filter(x=>x.ratio<=last.ratio).length/data.length).toFixed(1)+'%';document.getElementById('count').textContent=data.length.toLocaleString()+' 个共同交易日，自 '+data[0].date+' 起';draw();st.className='ok';st.textContent='加载成功：'+data.length+' 个共同交易日；最新数据 '+last.date+'。'}catch(e){st.className='err';st.textContent='读取失败：'+e.message+'。请检查网络或稍后重试。';document.getElementById('ratio').textContent='暂不可用'}}
document.getElementById('ranges').onclick=e=>{const b=e.target.closest('button[data-r]');if(!b)return;period=b.dataset.r;document.querySelectorAll('#ranges button[data-r]').forEach(x=>x.classList.toggle('active',x===b));if(data.length)draw()};document.getElementById('ma').onclick=()=>{showMA=!showMA;document.getElementById('ma').textContent='均线：'+(showMA?'开':'关');if(data.length)draw()};document.getElementById('refresh').onclick=load;document.getElementById('csv').onclick=()=>{if(!data.length)return;const rows=['日期,创业板指收盘,中证红利收盘,创业板指除以中证红利',...data.map(x=>[x.date,x.growth,x.dividend,x.ratio].join(','))];const a=document.createElement('a'),u=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv;charset=utf-8'}));a.href=u;a.download='创业板_中证红利_十年日线.csv';a.click();URL.revokeObjectURL(u)};window.addEventListener('resize',()=>chart.resize());load();
</script></body></html>
