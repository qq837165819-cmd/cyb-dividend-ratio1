name: Build first-board premium backtest
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_first_board_premium.py"
      - ".github/workflows/first-board-premium.yml"
  schedule:
    - cron: "40 12 * * 6"
concurrency:
  group: first-board-premium-backtest
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install akshare pandas requests
      - name: Build historical first-board premium backtest
        run: python scripts/build_first_board_premium.py
      - name: Commit backtest data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/first-board-premium-backtest.json
          git diff --cached --quiet || (git commit -m "data: refresh first-board premium backtest" && git push)
